name: CI

on:
  push:
  workflow_dispatch:

jobs:
  fast:
    name: fast (unit + integration + escaneo de secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo, no solo el ultimo commit

      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Tests fast (unit + integration, contra el stub local)
        run: pytest -m "unit or integration" -q

  redteam:
    name: redteam (suite adversarial, contra un modelo real)
    runs-on: ubuntu-latest
    # Solo manual por ahora. El disparador nocturno (`schedule`) se agrega en
    # la Fase 8, cuando la suite de redteam exista de verdad — un cron que
    # corre contra cero tests solo genera notificaciones de fallo sin valor.
    #
    # "Sistema real" no significa proveedor de pago: corre contra un modelo
    # local via Ollama (modo compatible con la API de OpenAI), asi que nunca
    # genera costo, ni aqui ni en tu maquina. Ver ADR-002.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Instalar y levantar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b

      - name: Tests redteam (contra Ollama local, modo OpenAI-compatible)
        env:
          UPSTREAM_BASE_URL: http://127.0.0.1:11434/v1
        run: pytest -m redteam -q
